version: '3.8'

services:
  skillify-api:
    build: .
    ports:
      - "8082:8082"
    environment:
      # MariaDB Database Configuration
      - SPRING_DATASOURCE_URL=jdbc:mariadb://temm_ead:3306/temm_ead
      - SPRING_DATASOURCE_USERNAME=melissa
      - SPRING_DATASOURCE_PASSWORD=faisca
      - SPRING_DATASOURCE_DRIVER_CLASS_NAME=org.mariadb.jdbc.Driver
      
      # JPA Configuration
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SPRING_JPA_DATABASE_PLATFORM=org.hibernate.dialect.MariaDBDialect
      - SPRING_JPA_SHOW_SQL=true
      
      # JWT Configuration
      - APPLICATION_SECURITY_JWT_SECRET_KEY=vF8gJ5U2Vn9pYqZ3q8NdPzWbGzF6Xt5+JNRVh4J3hWY=
      - APPLICATION_SECURITY_JWT_EXPIRATION=86400000
      
      # AWS S3 Configuration
      - AWS_ACCESS_KEY_ID=1aa131e4bcb24ea1b63959c6fe9ee24d
      - AWS_SECRET_ACCESS_KEY=3882b2d9b0a468e9b331587d3992597d
      - AWS_REGION=default
      - AWS_S3_BUCKET=ead
      - AWS_S3_ENDPOINT=https://usc1.contabostorage.com
      
      # Performance Settings
      - SPRING_TASK_EXECUTION_POOL_CORE_SIZE=10
      - SPRING_TASK_EXECUTION_POOL_MAX_SIZE=100
      - SPRING_TASK_EXECUTION_POOL_QUEUE_CAPACITY=2000
      - SERVER_TOMCAT_THREADS_MAX=500
      - SERVER_TOMCAT_THREADS_MIN_SPARE=20
      
      # File Upload Settings
      - SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE=10MB
      - SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE=10MB
      
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    depends_on:
      - mariadb

  mariadb:
    image: mariadb:10.11
    container_name: temm_ead
    environment:
      MYSQL_ROOT_PASSWORD: root_password_here
      MYSQL_DATABASE: temm_ead
      MYSQL_USER: melissa
      MYSQL_PASSWORD: faisca
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    restart: unless-stopped

volumes:
  mariadb_data: